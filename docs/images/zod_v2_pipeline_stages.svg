<text x="500" y="1410" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">preserved?</text>
<line x1="715" y1="1390" x2="920.0" y2="1390" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="817.5" y="1380" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="middle">reverted</text>
<rect x="920.0" y="1347" width="470" height="86" rx="43.0" fill="#fdf1ef" stroke="#c4432b" stroke-width="2"/>
<text x="1155" y="1379" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">Repair: no</text>
<text x="1155" y="1405" font-size="18" fill="#57606a" text-anchor="middle">green by undoing the change</text>
<line x1="500" y1="1456" x2="500" y2="1494" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="512" y="1473.0" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">preserved</text>
<rect x="180.0" y="1494" width="640" height="84" rx="42.0" fill="#eefaf3" stroke="#1a7f4b" stroke-width="2"/>
<text x="500" y="1526" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">Repair: yes</text>
<text x="500" y="1552" font-size="18" fill="#57606a" text-anchor="middle">target tests pass AND the recent change is preserved</text>
<line x1="500" y1="1578" x2="500" y2="1616" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="512" y="1595.0" font-size="17" fill="#57606a" text-anchor="start">signal check — successful repairs only</text>
<rect x="220.0" y="1616" width="560" height="84" rx="8" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="500" y="1649" font-size="21" font-weight="bold" fill="#1f2328" text-anchor="middle">⑤  Coverage signal</text>
<text x="249.046875" y="1676" font-size="18" fill="#57606a">by: </text>
<text x="281.59375" y="1676" font-size="17" font-family="DejaVu Sans Mono, monospace" fill="#57606a">signal-case.sh</text>
<text x="424.875" y="1676" font-size="18" fill="#57606a"> — line coverage of the changed file</text>
<line x1="500" y1="1700" x2="500" y2="1728" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="500,1728.0 735.0,1798 500,1868.0 265.0,1798" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
<text x="500" y="1793" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">changed production</text>
<text x="500" y="1818" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">file executed?</text>
<line x1="735" y1="1798" x2="920.0" y2="1798" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="827.5" y="1788" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="middle">line coverage = 0</text>
<rect x="920.0" y="1755" width="470" height="86" rx="43.0" fill="#fdf1ef" stroke="#c4432b" stroke-width="2"/>
<text x="1155" y="1787" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">Covered: no</text>
<text x="1155" y="1813" font-size="18" fill="#57606a" text-anchor="middle">tests no longer reach the changed file</text>
<line x1="500" y1="1868" x2="500" y2="1904" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="512" y="1884.0" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">line coverage &gt; 0</text>
<rect x="220.0" y="1904" width="560" height="86" rx="43.0" fill="#eefaf3" stroke="#1a7f4b" stroke-width="2"/>
<text x="500" y="1936" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">Covered: yes</text>
<text x="500" y="1962" font-size="18" fill="#57606a" text-anchor="middle">tests still execute the changed file</text>
</svg>
