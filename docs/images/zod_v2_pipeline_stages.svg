<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="2050" viewBox="0 0 1460 2050" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<rect width="1460" height="2050" fill="#ffffff"/>
<text x="730.0" y="54" font-size="30" font-weight="bold" fill="#1f2328" text-anchor="middle">Case-level pipeline — five stages</text>
<rect x="150" y="82" width="1160" height="50" rx="10" fill="#fcfcfd" stroke="#d0d5db" stroke-width="1.5"/>
<text x="166" y="112" font-size="16" font-weight="bold" fill="#6a707a" text-anchor="start">Legend</text>
<rect x="300" y="96.0" width="30" height="22" rx="11" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="339" y="113.0" font-size="16" fill="#1f2328" text-anchor="start">start / end</text>
<rect x="456.015625" y="96.0" width="30" height="22" rx="4" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="495.015625" y="113.0" font-size="16" fill="#1f2328" text-anchor="start">process</text>
<polygon points="610.53125,94.0 630.53125,107.0 610.53125,120.0 590.53125,107.0" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
<text x="639.53125" y="113.0" font-size="16" fill="#1f2328" text-anchor="start">branch</text>
<rect x="729.15625" y="96.0" width="30" height="22" rx="11" fill="#fdf1ef" stroke="#c4432b" stroke-width="2"/>
<text x="768.15625" y="113.0" font-size="16" fill="#1f2328" text-anchor="start">failure outcome</text>
<rect x="928.078125" y="96.0" width="30" height="22" rx="11" fill="#eefaf3" stroke="#1a7f4b" stroke-width="2"/>
<text x="967.078125" y="113.0" font-size="16" fill="#1f2328" text-anchor="start">success outcome</text>
<rect x="220.0" y="150" width="560" height="86" rx="43.0" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="500" y="182" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">Case fixture</text>
<text x="500" y="208" font-size="18" fill="#57606a" text-anchor="middle">code + a recent change + captured test output</text>
<line x1="500" y1="234" x2="500" y2="262" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="220.0" y="262" width="560" height="140" rx="8" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="500" y="295" font-size="21" font-weight="bold" fill="#1f2328" text-anchor="middle">①  Decision — model call</text>
<text x="500" y="322" font-size="18" fill="#57606a" text-anchor="middle">by: model — one request, one reply, no retries</text>
<text x="500" y="349" font-size="18" fill="#57606a" text-anchor="middle">sees: recent-change diff · test output · code snippets</text>
<text x="500" y="376" font-size="18" fill="#57606a" text-anchor="middle">replies: DECISION + repair diff (when fixing)</text>
<line x1="500" y1="402" x2="500" y2="430" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="500,430.0 690.0,492 500,554.0 310.0,492" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
<text x="500" y="499" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">DECISION?</text>
<line x1="690" y1="492" x2="920.0" y2="492" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="805.0" y="482" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="middle">no_change</text>
<rect x="920.0" y="449" width="470" height="86" rx="43.0" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="1155" y="481" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">case ends here</text>
<text x="1155" y="507" font-size="18" fill="#57606a" text-anchor="middle">no diff — judged against expected</text>
<line x1="500" y1="554" x2="500" y2="616" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="512" y="573.0" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">fix_tests / fix_production</text>
<text x="512" y="594.0" font-size="17" fill="#57606a" text-anchor="start">repair diff attached</text>
<rect x="220.0" y="616" width="560" height="84" rx="8" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="500" y="649" font-size="21" font-weight="bold" fill="#1f2328" text-anchor="middle">②  Patch apply</text>
<text x="252.71875" y="676" font-size="18" fill="#57606a">by: </text>
<text x="285.265625" y="676" font-size="17" font-family="DejaVu Sans Mono, monospace" fill="#57606a">apply-patch.py</text>
<text x="428.546875" y="676" font-size="18" fill="#57606a"> — apply the model diff to the code</text>
<line x1="500" y1="700" x2="500" y2="728" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="500,728.0 685.0,790 500,852.0 315.0,790" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
<text x="500" y="797" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">diff applies?</text>
<line x1="685" y1="790" x2="920.0" y2="790" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="802.5" y="780" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="middle">cannot apply</text>
<rect x="920.0" y="747" width="470" height="86" rx="43.0" fill="#fdf1ef" stroke="#c4432b" stroke-width="2"/>
<text x="1155" y="779" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">Repair: no</text>
<text x="1155" y="805" font-size="18" fill="#57606a" text-anchor="middle">diff references code not in the tree</text>
<line x1="500" y1="852" x2="500" y2="914" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="512" y="871.0" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">applies</text>
<text x="512" y="892.0" font-size="17" fill="#57606a" text-anchor="start">patched tree</text>
<rect x="220.0" y="914" width="560" height="84" rx="8" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="500" y="947" font-size="21" font-weight="bold" fill="#1f2328" text-anchor="middle">③  Validation</text>
<text x="293.8125" y="974" font-size="18" fill="#57606a">by: </text>
<text x="326.359375" y="974" font-size="17" font-family="DejaVu Sans Mono, monospace" fill="#57606a">validate.sh</text>
<text x="438.9375" y="974" font-size="18" fill="#57606a"> — run the case’s target tests</text>
<line x1="500" y1="998" x2="500" y2="1026" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="500,1026.0 700.0,1088 500,1150.0 300.0,1088" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
<text x="500" y="1095" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">target tests pass?</text>
<line x1="700" y1="1088" x2="920.0" y2="1088" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="810.0" y="1078" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="middle">fail</text>
<rect x="920.0" y="1045" width="470" height="86" rx="43.0" fill="#fdf1ef" stroke="#c4432b" stroke-width="2"/>
<text x="1155" y="1077" font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle">Repair: no</text>
<text x="1155" y="1103" font-size="18" fill="#57606a" text-anchor="middle">target tests still fail</text>
<line x1="500" y1="1150" x2="500" y2="1212" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="512" y="1169.0" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">pass</text>
<text x="512" y="1190.0" font-size="17" fill="#57606a" text-anchor="start">passing tree</text>
<rect x="220.0" y="1212" width="560" height="84" rx="8" fill="#f6f8fa" stroke="#8a8f98" stroke-width="2"/>
<text x="500" y="1245" font-size="21" font-weight="bold" fill="#1f2328" text-anchor="middle">④  Preservation check</text>
<text x="246.3984375" y="1272" font-size="18" fill="#57606a">by: </text>
<text x="278.9453125" y="1272" font-size="17" font-family="DejaVu Sans Mono, monospace" fill="#57606a">git apply --reverse --check</text>
<text x="555.2734375" y="1272" font-size="18" fill="#57606a"> — static, no tests run</text>
<line x1="500" y1="1296" x2="500" y2="1324" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="500,1324.0 715.0,1390 500,1456.0 285.0,1390" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
