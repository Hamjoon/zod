services:
  tp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    image: testpilot-zod:latest
    working_dir: /work
    volumes:
      - ../../..:/work/zod
      - ../../../../testpilot2:/work/testpilot2
      - ../../../../zod-versions:/work/zod-versions
    tty: true
    stdin_open: true
